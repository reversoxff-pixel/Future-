<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | FUTURO+</title><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="header"><nav class="nav container"><a class="logo" href="../index.html">FUTURO<span>+</span></a><div class="nav-links"><a href="../index.html">Início</a><a href="vagas.html">Vagas</a><a href="cursos.html">Cursos</a></div><div class="nav-actions"><a class="login-link" href="login.html">Entrar</a></div></nav></header>
<main class="container"><section class="form-card"><span class="eyebrow">FAÇA PARTE DO FUTURO+</span><h2>Crie sua conta</h2><p>Crie sua conta para acessar a área pessoal do FUTURO+.</p><form id="register-form"><div class="field"><label for="reg-name">Nome completo</label><input id="reg-name" required maxlength="80" autocomplete="name"></div><div class="field"><label for="reg-email">E-mail</label><input id="reg-email" type="email" required autocomplete="email"></div><div class="field"><label for="reg-password">Senha</label><input id="reg-password" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label for="reg-confirm">Confirme a senha</label><input id="reg-confirm" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" type="submit">Criar perfil <i data-lucide="user-plus"></i></button></form><p id="register-message" class="form-message" role="status"></p><div class="notice">Sua senha é protegida por hash no servidor antes de ser salva no banco de dados. Use uma senha forte.</div><p style="margin-top:15px;font-size:12px;color:var(--muted)">Já tem perfil? <a class="text-link" href="login.html">Entrar</a></p></section></main>
<footer class="footer"><div class="container footer-bottom"><span>© <span data-year></span> FUTURO+</span><a href="../index.html">Voltar ao início</a></div></footer><script src="https://unpkg.com/lucide@latest"></script><script src="../js/main.js"></script><script src="../js/auth.js"></script></body></html>
